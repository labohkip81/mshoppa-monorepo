components:
  schemas:
    Application:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        category:
          type: string
          maxLength: 60
        phone:
          type: string
          maxLength: 30
        country:
          type: string
          maxLength: 2
        currency:
          type: string
          maxLength: 3
        description:
          type: string
          maxLength: 2000
        status:
          allOf:
          - $ref: '#/components/schemas/ApplicationStatusEnum'
          readOnly: true
        review_note:
          type: string
          readOnly: true
        submitted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        owner_email:
          type: string
          format: email
          readOnly: true
        business:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        provisioning_status:
          type: string
          readOnly: true
      required:
      - business
      - category
      - country
      - created_at
      - currency
      - id
      - name
      - owner_email
      - phone
      - provisioning_status
      - review_note
      - reviewed_at
      - slug
      - status
      - submitted_at
    ApplicationRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          minLength: 1
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        category:
          type: string
          minLength: 1
          maxLength: 60
        phone:
          type: string
          minLength: 1
          maxLength: 30
        country:
          type: string
          minLength: 1
          maxLength: 2
        currency:
          type: string
          minLength: 1
          maxLength: 3
        description:
          type: string
          maxLength: 2000
      required:
      - category
      - country
      - currency
      - name
      - phone
      - slug
    ApplicationStatusEnum:
      enum:
      - draft
      - pending
      - changes_requested
      - approved
      - rejected
      type: string
      description: |-
        * `draft` - Draft
        * `pending` - Pending review
        * `changes_requested` - Changes requested
        * `approved` - Approved
        * `rejected` - Rejected
    Business:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        country:
          type: string
          maxLength: 2
        currency:
          type: string
          maxLength: 3
        provisioning_status:
          type: string
          maxLength: 12
        suspended:
          type: boolean
        published:
          type: boolean
        role:
          type: string
          readOnly: true
        domains:
          type: array
          items:
            $ref: '#/components/schemas/Domain'
          readOnly: true
        storefront_url:
          type: string
          readOnly: true
      required:
      - country
      - currency
      - domains
      - id
      - name
      - role
      - slug
      - storefront_url
    CartItemRequest:
      type: object
      properties:
        variant_id:
          type: string
          format: uuid
        quantity:
          type: integer
          maximum: 99
          minimum: 1
      required:
      - quantity
      - variant_id
    CheckoutRequest:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItemRequest'
        checkout_key:
          type: string
          format: uuid
        quote_token:
          type: string
          minLength: 1
          maxLength: 2000
        name:
          type: string
          minLength: 1
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
        phone:
          type: string
          default: ''
          maxLength: 30
        address:
          type: string
          minLength: 1
          maxLength: 500
        provider:
          $ref: '#/components/schemas/ProviderEnum'
      required:
      - address
      - checkout_key
      - email
      - items
      - name
      - provider
      - quote_token
    CodeRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          pattern: ^\d{6}$
      required:
      - code
    Customer:
      type: object
      properties:
        email:
          type: string
          format: email
        order_count:
          type: integer
        paid_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        last_order:
          type: string
          format: date-time
      required:
      - email
      - last_order
      - order_count
      - paid_total
    DecisionEnum:
      enum:
      - approved
      - changes_requested
      - rejected
      type: string
      description: |-
        * `approved` - approved
        * `changes_requested` - changes_requested
        * `rejected` - rejected
    Detail:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    Domain:
      type: object
      properties:
        hostname:
          type: string
          maxLength: 253
        verified:
          type: boolean
        is_primary:
          type: boolean
      required:
      - hostname
    DomainAdmin:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        hostname:
          type: string
          maxLength: 253
        verified:
          type: boolean
          readOnly: true
        is_primary:
          type: boolean
          readOnly: true
      required:
      - hostname
      - id
