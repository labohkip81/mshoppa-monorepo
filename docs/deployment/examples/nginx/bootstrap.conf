# Install FIRST, before requesting certificates. Replace example.com.
# A fresh Ubuntu Nginx install's default site must be disabled first.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}
