# Replaces bootstrap.conf AFTER the wildcard certificate has been issued.
# Install as /etc/nginx/sites-available/mshoppa and enable it once.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        if ($mshoppa_app = "") { return 404; }
        return 308 https://$host$request_uri;
    }
}
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com *.example.com;
    ssl_certificate /etc/letsencrypt/live/mshoppa-platform/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mshoppa-platform/privkey.pem;
    include /etc/nginx/snippets/mshoppa-app.conf;
}
# One exact-host TLS server per customer certificate, created AFTER issuance.
include /etc/nginx/mshoppa/custom-domains/*.conf;
