# Install as /etc/nginx/snippets/mshoppa-app.conf; include inside TLS servers.
if ($mshoppa_app = "") { return 404; }
if ($mshoppa_private_route = 1) { return 404; }
# Require HTTP Host and TLS SNI to agree; also rejects domain fronting.
if ($host != $ssl_server_name) { return 421; }
root /srv/mshoppa/www/$mshoppa_app;
index index.html;
client_max_body_size 12m;
access_log /var/log/nginx/mshoppa-access.log mshoppa;

# Keep real /api/ paths, the tenant Host, and a trusted HTTPS indicator.
location ^~ /api/ {
    proxy_pass http://$mshoppa_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 45s;
    proxy_send_timeout 45s;
    proxy_cache off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    gzip off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
}
# Only content-hashed build files get a year-long immutable cache lifetime.
# The file must actually exist: missing old chunks must never return index.html.
location ~* "^/(?:.*/)?[^/]+-[a-z0-9_-]{8,}\.(?:js|css|woff2)$" {
    try_files $uri =404;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
}
# Unversioned build assets have a short lifetime; these are NOT user uploads.
location ~* \.(?:js|css|woff2|png|jpg|jpeg|webp|svg|ico|txt)$ {
    try_files $uri =404;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml text/plain;
    add_header Cache-Control "public, max-age=3600";
    add_header X-Content-Type-Options nosniff always;
}
location = /index.html {
    gzip on;
    gzip_vary on;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
}
location ~ /\. { return 404; }
location / { try_files $uri /index.html; }
