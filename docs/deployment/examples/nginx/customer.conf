# Example only. Replace shop.merchant.example and the certificate lineage.
# Install under /etc/nginx/mshoppa/custom-domains/ after issuing its certificate.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shop.merchant.example;
    ssl_certificate /etc/letsencrypt/live/shop.merchant.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.merchant.example/privkey.pem;
    include /etc/nginx/snippets/mshoppa-app.conf;
}
