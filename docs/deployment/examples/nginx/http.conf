# Install as /etc/nginx/conf.d/mshoppa.conf (inside nginx's http context).
# Replace example.com everywhere. Create the referenced empty files/directories.
upstream mshoppa_core {
    server 127.0.0.1:8000;
    keepalive 8;
}
upstream mshoppa_payments {
    server 127.0.0.1:8001;
    keepalive 8;
}
map $host $mshoppa_app {
    default "";
    example.com marketing;
    admin.example.com merchant-admin;
    platform.example.com platform-admin;
    payments.example.com payments;
    # Explicit entries only: shop.example.com storefront;
    # Custom domains also go here: shop.merchant.example storefront;
    include /etc/nginx/mshoppa/store-hosts.map;
}
map $host $mshoppa_upstream {
    default mshoppa_core;
    payments.example.com mshoppa_payments;
}
# Internal services call loopback directly; these routes are never public.
map $uri $mshoppa_private_route {
    default 0;
    /api/payments/checkout/ 1;
    /api/payments/webhooks/dummy/ 1;
    /api/configuration/ 1;
    /api/providers/ 1;
    /api/sessions/ 1;
    ~^/api/webhooks/dummy/ 1;
    ~^/api/sessions/[^/]+/simulate/ 1;
}
# No queries, cookies, bodies or order/session token paths in access logs.
log_format mshoppa '$remote_addr $host $request_method $status '
                   '$body_bytes_sent rt=$request_time urt=$upstream_response_time';
server_tokens off;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:MSHOPPA:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
